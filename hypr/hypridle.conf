general {
    lock_cmd = pidof hyprlock || hyprlock       # don't spawn multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen on after wake
}

listener {
    timeout = 300                               # 5 min → dim screen
    on-timeout = brightnessctl -s set 10%       # save & dim
    on-resume = brightnessctl -r                # restore brightness
}

listener {
    timeout = 600                               # 10 min → lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900                               # 15 min → sleep
    on-timeout = systemctl suspend
}
