source=~/.config/hypr/colors.conf

background {
    path = ~/.cache/current_wallpaper

    blur_passes = 3
    blur_size = 8

    noise = 0.01
    contrast = 1.05
    brightness = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.6
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = rgba(ffb1c6ff)       # primary (accent border)
    inner_color = rgba(31282aff)       # surface_container_high
    font_color = rgba(efdfe1ff)        # on_surface
    fade_on_empty = true

    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(efdfe1ff)             # on_surface
    font_size = 14
    font_family = JetBrainsMono Nerd Font   # adjust if needed
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = rgba(efdfe1ff)             # on_surface
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -25
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = rgba(efdfe1ff)             # on_surface
    font_size = 65
    font_family = Google Sans Flex       # or your clock font

    position = 0, 300
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = rgba(efdfe1ff)             # on_surface
    font_size = 17
    font_family = Google Sans Flex

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = rgba(efdfe1ff)             # on_surface
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = rgba(efdfe1ff)             # on_surface
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 30, -30
    halign = left
    valign = top
}
