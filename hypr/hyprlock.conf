# USER
label {
    monitor =
    text = Hello, $USER
    color = $on_surface
    font_size = 25
    font_family = Google Flex Mono
    position = 0, -70
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 290, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $outline
    inner_color = $surface_container_high
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = 󰌾 Password
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/songdetail.sh
    color = $tertiary
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = bottom
}

# CAPS LOCK WARNING
label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $error
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -25
    halign = center
    valign = center
}

# STATUS
label {
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $on_surface_variant
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 30, -30
    halign = left
    valign = top
}
