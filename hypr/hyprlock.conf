source = ~/.config/hypr/colors.conf

# BACKGROUND
background {
    monitor =
    path = $image
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 1.05
    brightness = 0.9
    vibrancy = 0.2
    vibrancy_darkness = 0.6
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    color = $primary
    font_size = 120
    font_family = Google Flex Mono
    position = 0, -140
    halign = center
    valign = top
}

# DAY-DATE-MONTH
label {
    monitor = 
    text = cmd[update:5000] echo "<span>$(date '+%A, %d %B')</span>"
    color = $on_surface
    font_size = 30
    font_family = Google Flex Mono
    position = 0, 200
    halign = center
    valign = center
}

