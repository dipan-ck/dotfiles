source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybindings.conf


################
### MONITORS ###
################

monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@165,1920x0,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show run


#################
### AUTOSTART ###
#################

exec-once = quickshell
exec-once = hyprsunset
exec-once = awww-daemon
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 8

    border_size = 1

    col.active_border = rgba(3f484aff)
    col.inactive_border = rgba(3f484aff)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes

    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = fast, 0.2, 0, 0, 1

    animation = windows,       1, 3, smooth
    animation = windowsIn,     1, 3, smooth, popin 80%
    animation = windowsOut,    1, 2, fast, popin 80%

    animation = border,        1, 2, smooth
    animation = fade,          1, 2, smooth

    animation = workspaces,    1, 3, smooth
    animation = workspacesIn,  1, 3, smooth, slide
    animation = workspacesOut, 1, 2, fast, slide

    animation = layers,        1, 2, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##################
### WINDOWRULES ###
##################

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = match:class kitty, opacity 1
