source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/keybindings.conf


################
### MONITORS ###
################

monitor=eDP-1,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@165,1920x0,1


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = rofi -show run


#################
### AUTOSTART ###
#################
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'adw-gtk3-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
# exec-once = hyprctl setcursor Bibata-Modern-Classic 20
exec-once = hypridle

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
hyprenv = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 6

    border_size = 1

    col.active_border =  rgba(3f484aff)
    col.inactive_border = rgba(3f484aff)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding       = 12
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled      = false
        range        = 20
        render_power = 3
        color        = rgba(00000055)
        offset       = 0 4
    }

    blur {
        enabled          = true
        size             = 8
        passes           = 3
        contrast         = 1.0
        brightness       = 0.9
        vibrancy         = 0.2
        vibrancy_darkness = 0.3
        popups           = true
        popups_ignorealpha = 0.2
    }
}

animations {
    enabled = yes

    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = fast, 0.2, 0, 0, 1

    animation = windows,       1, 3, smooth
    animation = windowsIn,     1, 3, smooth, popin 80%
    animation = windowsOut,    1, 2, fast, popin 80%

    animation = border,        1, 2, smooth
    animation = fade,          1, 2, smooth

    animation = workspaces,    1, 3, smooth
    animation = workspacesIn,  1, 3, smooth, slide
    animation = workspacesOut, 1, 2, fast, slide

    animation = layers,        1, 2, smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##################
### WINDOWRULES ###
##################

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = opacity-apps
    opacity = 0.90
    match:class = (org.gnome.Nautilus|blueman-manager|kitty)
}
windowrule {
    name = kitty-nvim-noblur
    opacity = 1
    match:class = ^(kitty)$
    match:title = ^(nvim)$
    no_blur = on
}
# swaync notifications
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window

# swaync control center
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center

# # rofi
# layerrule = blur on, match:namespace rofi
# layerrule = ignore_alpha 0.2, match:namespace rofi
# layerrule = xray on, match:namespace rofi
